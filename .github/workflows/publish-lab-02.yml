
name: Lab 02 - Test Build Publish

on:
  push:
    branches: [lab-02]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab-02

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t lab2:${GITHUB_SHA} \
            lab-02


  publish:
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase GHCR owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./lab-02
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/catshop-lab-02:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Print image digest
        run: |
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Image: ghcr.io/${{ steps.owner.outputs.name }}/catshop-lab-02@${{ steps.push.outputs.digest }}"
