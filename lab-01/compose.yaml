services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-labuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-labdb}"
      PARTNER_URL: "http://partner:8080"
    depends_on:
      db:
        condition: service_healthy
      partner:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labpass}
      POSTGRES_DB: ${POSTGRES_DB:-labdb}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  partner:
    image: wiremock/wiremock:3.6.0
    volumes:
      - ./partner:/home/wiremock:ro

volumes:
  db_data:
